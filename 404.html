<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Maskarwadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fraunces:opsz,wght@9..40,400;9..40,500&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/village.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    .nf { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; background: var(--bg-alt); }
    .nf-inner { max-width: 460px; }
    .nf h1 { font-family: var(--font-display); font-size: clamp(3.5rem, 12vw, 6rem); color: var(--green); line-height: 1; margin-bottom: 12px; font-weight: 600; }
    .nf h2 { font-family: var(--font-display); font-size: 1.5rem; color: var(--text); margin-bottom: 12px; font-weight: 500; }
    .nf p { color: var(--text-light); margin-bottom: 28px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-inner">
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you are looking for may have moved or no longer exists.</p>
      <a href="/" class="btn btn-primary">Back to Maskarwadi</a>
    </div>
  </main>
</body>
</html>
